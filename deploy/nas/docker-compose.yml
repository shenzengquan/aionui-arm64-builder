# =============================================================================
# AionUi Web - 绿联 DH4300 Plus (RK3588 / ARM64) 离线部署
# =============================================================================
# 前提：镜像已经通过 docker load 导入（见 README 第 4 步）
#
# 铁律：数据目录必须落在 SATA 卷，不要写进 32GB eMMC。
#   - 绿联 UGOS 常见挂载点：/volume1 /volume2 /volume3 ...
#   - 下面用 ${AIONUI_DATA_DIR} 变量占位，部署时在 .env 里填真实路径
#
# 重要：docker compose 的 deploy.resources.limits 在非 Swarm 模式下会被忽略。
#   单机 compose 请用 mem_limit / memswap_limit（已写在下面）。
# =============================================================================

services:
  aionui:
    image: aionui:${AIONUI_IMAGE_TAG:-2.2.2}
    container_name: aionui
    restart: unless-stopped

    # 离线部署：镜像本地已有，禁止尝试拉取
    pull_policy: never

    # -----------------------------------------------------------------------
    # 运行用户：必须用 root（0:0）
    # -----------------------------------------------------------------------
    # 镜像内建的非 root 用户是 uid=1000，但绿联 UGOS 的卷挂 `ugacl` 模块，
    # 普通用户无法 chown 宿主机目录到 1000（报 Operation not permitted）。
    # 若不以 root 跑，容器会启动失败：
    #     [aionui-web] fatal: EACCES: permission denied, mkdir '/data/logs'
    # 说明：目录本身是 777，但 ugacl 不按 other 位判定写权限，
    # 与现有 czyt_aionui-1 容器的做法保持一致（同样以 root 运行）。
    # -----------------------------------------------------------------------
    user: "0:0"

    ports:
      # 左侧为 NAS 暴露端口，可按需改
      - "${AIONUI_PORT:-3000}:3000"

    volumes:
      # 数据目录 -> SATA 卷（必须，不要用 eMMC）
      - ${AIONUI_DATA_DIR:?AIONUI_DATA_DIR 未设置，请在 .env 中指定 SATA 卷路径}:/data

    environment:
      AIONUI_PORT: "3000"
      AIONUI_ALLOW_REMOTE: "true"
      AIONUI_DATA_DIR: "/data"
      AIONUI_LOG_DIR: "/data/logs"
      TZ: "${TZ:-Asia/Shanghai}"
      NODE_ENV: "production"

    # 内存上限：RK3588 是 8GB 板载内存不可扩展。
    # 注意：deploy.resources.limits 只在 Swarm 模式生效，
    # 单机 docker compose 必须用 mem_limit。两个都写，兼容两种部署方式。
    # 默认 2g（而非 3g）：实测 NAS 上可用内存常只剩 3~3.5G（还有 swap 在用），
    # 给太大反而容易触发系统级 OOM，把别的容器一起拖死。
    mem_limit: ${AIONUI_MEM_LIMIT:-2g}
    memswap_limit: ${AIONUI_MEM_LIMIT:-2g}
    deploy:
      resources:
        limits:
          memory: ${AIONUI_MEM_LIMIT:-2g}
        reservations:
          memory: 512m

    # 日志轮转，避免长跑把 SATA 写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
